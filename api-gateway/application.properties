# ==========================================
# SERVER
# Render inject PORT tự động
# ==========================================
server.port=${PORT:8080}
spring.application.name=api-gateway

# ==========================================
# EUREKA
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:api-gateway}
eureka.instance.non-secure-port=${PORT:8080}
eureka.instance.instance-id=${RENDER_SERVICE_ID:${spring.application.name}}

# ==========================================
# SPRING CLOUD GATEWAY ROUTES
# ==========================================

# 1. User service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users,/users/**,/registration/**,/roles/**,/login/**,/auth/**
spring.cloud.gateway.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 2. Product catalog
spring.cloud.gateway.routes[1].id=product-catalog-service
spring.cloud.gateway.routes[1].uri=lb://product-catalog-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/products,/products/**,/admin/**,/images/**
spring.cloud.gateway.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 3. Recommendation
spring.cloud.gateway.routes[2].id=product-recommendation-service
spring.cloud.gateway.routes[2].uri=lb://product-recommendation-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/*/recommendations/**,/recommendations/**

# 4. Order service
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://order-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/order,/order/**,/cart/**,/tables,/tables/**,/bills/**

# 5. Payment service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments,/api/payments/**

# 6. Revenue (cũng thuộc payment-service)
spring.cloud.gateway.routes[5].id=revenue-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/revenue,/api/revenue/**

# 7. Setting service — /settings/**
spring.cloud.gateway.routes[6].id=setting-service
spring.cloud.gateway.routes[6].uri=lb://setting-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/settings/**
spring.cloud.gateway.routes[6].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 8. Setting service — /api/settings/** → rewrite sang /settings/**
spring.cloud.gateway.routes[7].id=setting-service-api-prefix
spring.cloud.gateway.routes[7].uri=lb://setting-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/settings/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/api/(?<segment>.*), /${segment}
spring.cloud.gateway.routes[7].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 9. Socket proxy — /socket.io/** → Node.js socket server
# SOCKET_SERVER_URL set trên Render env vars (vd: https://ecom-socket-server.onrender.com)
spring.cloud.gateway.routes[8].id=socket-server
spring.cloud.gateway.routes[8].uri=${SOCKET_SERVER_URL:http://localhost:5000}
spring.cloud.gateway.routes[8].predicates[0]=Path=/socket.io/**
spring.cloud.gateway.routes[8].filters[0]=PreserveHostHeader

# ==========================================
# SESSION
# ==========================================
spring.session.store-type=none

# ==========================================
# CORS — cấu hình chi tiết trong CorsConfig.java
# FRONTEND_URL set trên Render env vars
# ==========================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


# ==========================================
# EUREKA LEASE — chống stale instance khi Render redeploy
# ==========================================
# Heartbeat mỗi 10s (mặc định 30s)
eureka.instance.lease-renewal-interval-in-seconds=10
# Bị evict sau 20s không heartbeat (mặc định 90s)
eureka.instance.lease-expiration-duration-in-seconds=20

# ==========================================
# GRACEFUL SHUTDOWN
# Khi Render stop container, Spring Boot gửi deregister về Eureka
# trước khi tắt → không để lại stale instance
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Bật endpoint /actuator/shutdown để Render có thể trigger graceful stop
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,shutdown
