# ==========================================
# CẤU HÌNH SERVER & EUREKA
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.port=8811
spring.application.name=user-service

# ==========================================
# CẤU HÌNH DATABASE (AIVEN POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/defaultdb
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# ==========================================
# ==========================================

# ==========================================
# JPA / HIBERNATE (Chuẩn Spring Boot 3)
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# CẤU HÌNH THÔNG BÁO LỖI TÙY CHỈNH
# ==========================================
error.404.schema.details=The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable
error.406.schema.details=This request is not acceptable. Supported MIME types are application/json

# ==========================================
# CẤU HÌNH EMAIL (GMAIL SMTP)
# ==========================================
spring.mail.username=your_gmail@gmail.com
spring.mail.password=your_gmail_app_password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# URL frontend để tạo link reset
app.frontend.url=http://localhost:3000

# Thời gian hết hạn token reset (phút)
app.reset.token.expiry.minutes=15