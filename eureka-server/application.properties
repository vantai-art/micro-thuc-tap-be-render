server.port=${PORT:8761}
spring.application.name=eureka-server

# Standalone mode — không tự đăng ký với chính mình
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:${PORT:8761}/eureka/

# Tắt self-preservation → Eureka sẽ evict instance DOWN ngay
eureka.server.enable-self-preservation=false
eureka.server.renewal-percent-threshold=0.49

# Evict instance DOWN sau 15s kiểm tra (mặc định 60s — quá chậm cho cloud)
eureka.server.eviction-interval-timer-in-ms=15000

# Lease expiry: instance bị coi là DOWN nếu không heartbeat trong 20s
# (mặc định 90s — quá lâu cho Render free tier)
eureka.instance.lease-expiration-duration-in-seconds=20
eureka.instance.lease-renewal-interval-in-seconds=10

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
