# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8813}
spring.application.name=order-service

# ==========================================
# EUREKA
# Render: mỗi service là container riêng biệt.
# prefer-ip-address=false + dùng hostname để Eureka nhận diện đúng.
# EUREKA_SERVER_URL được set qua env var trên Render dashboard.
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:order-service}
eureka.instance.non-secure-port=${PORT:8813}
eureka.instance.instance-id=${RENDER_SERVICE_ID:${spring.application.name}}

# ==========================================
# DATABASE
# Set SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD trên Render env vars
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================
# REDIS
# REDIS_HOST được set qua env var trên Render (Upstash hoặc Redis Cloud).
# Nếu không có Redis, đặt REDIS_HOST=localhost sẽ fail gracefully khi dùng cart.
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# QUAN TRỌNG: tắt Redis session — chỉ dùng Redis cho Cart
spring.session.store-type=none

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


# ==========================================
# EUREKA LEASE — chống stale instance khi Render redeploy
# ==========================================
# Heartbeat mỗi 10s (mặc định 30s)
eureka.instance.lease-renewal-interval-in-seconds=10
# Bị evict sau 20s không heartbeat (mặc định 90s)
eureka.instance.lease-expiration-duration-in-seconds=20

# ==========================================
# GRACEFUL SHUTDOWN
# Khi Render stop container, Spring Boot gửi deregister về Eureka
# trước khi tắt → không để lại stale instance
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Bật endpoint /actuator/shutdown để Render có thể trigger graceful stop
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,shutdown
