# ==========================================
# CẤU HÌNH SERVER & EUREKA
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.port=8813
spring.application.name=order-service

# ==========================================
# CẤU HÌNH DATABASE (AIVEN POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/defaultdb
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Đăng ký với Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# ==========================================

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# CẤU HÌNH REDIS (chỉ dùng cho Cart)
# ==========================================
# FIX: Chỉ giữ kết nối Redis cho CartRedisRepository
# Đã XÓA spring.session.store-type=redis vì @EnableRedisHttpSession đã bị bỏ
# Nếu giữ spring.session.store-type=redis mà không có @EnableRedisHttpSession
# Spring Boot vẫn tự bật Redis Session → 500 khi Redis chưa chạy
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.store-type=none