# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8816}
spring.application.name=setting-service

# ==========================================
# EUREKA
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:setting-service}
eureka.instance.non-secure-port=${PORT:8816}
eureka.instance.instance-id=${RENDER_SERVICE_ID:${spring.application.name}}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settings_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================
# JPA open-in-view: tắt để bỏ warning
# ==========================================
spring.jpa.open-in-view=false

# ==========================================
# ERROR
# ==========================================
error.404.schema.details=Setting not found
error.406.schema.details=This request is not acceptable. Supported MIME types are application/json

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


# ==========================================
# EUREKA LEASE — chống stale instance khi Render redeploy
# ==========================================
# Heartbeat mỗi 10s (mặc định 30s)
eureka.instance.lease-renewal-interval-in-seconds=10
# Bị evict sau 20s không heartbeat (mặc định 90s)
eureka.instance.lease-expiration-duration-in-seconds=20

# ==========================================
# GRACEFUL SHUTDOWN
# Khi Render stop container, Spring Boot gửi deregister về Eureka
# trước khi tắt → không để lại stale instance
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Bật endpoint /actuator/shutdown để Render có thể trigger graceful stop
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,shutdown
