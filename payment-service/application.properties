# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8819}
spring.application.name=payment-service

# ==========================================
# EUREKA
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:payment-service}
eureka.instance.non-secure-port=${PORT:8819}
eureka.instance.instance-id=${RENDER_SERVICE_ID:${spring.application.name}}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================
# VNPAY
# Set các giá trị thật trên Render env vars — KHÔNG commit vào git
# ==========================================
vnpay.tmn-code=${VNPAY_TMN_CODE:your_vnpay_tmn_code}
vnpay.hash-secret=${VNPAY_HASH_SECRET:your_vnpay_hash_secret}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${API_GATEWAY_URL:https://ecom-api-gateway-phoe.onrender.com}/api/payments/vnpay/return
vnpay.frontend-success-url=${FRONTEND_URL:http://localhost:3000}/checkout
vnpay.frontend-fail-url=${FRONTEND_URL:http://localhost:3000}/checkout

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


# ==========================================
# EUREKA LEASE — chống stale instance khi Render redeploy
# ==========================================
# Heartbeat mỗi 10s (mặc định 30s)
eureka.instance.lease-renewal-interval-in-seconds=10
# Bị evict sau 20s không heartbeat (mặc định 90s)
eureka.instance.lease-expiration-duration-in-seconds=20

# ==========================================
# GRACEFUL SHUTDOWN
# Khi Render stop container, Spring Boot gửi deregister về Eureka
# trước khi tắt → không để lại stale instance
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Bật endpoint /actuator/shutdown để Render có thể trigger graceful stop
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,shutdown
