# ==========================================
# CẤU HÌNH SERVER & EUREKA
# ==========================================
server.port=8810
spring.application.name=product-catalog-service

# ==========================================
# CẤU HÌNH DATABASE (AIVEN POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/defaultdb
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Eureka Server registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# ==========================================

# ==========================================
# JPA / HIBERNATE (Spring Boot 3 / Hibernate 6)
# ==========================================
spring.jpa.show-sql=true
# Hibernate 6 tự nhận diện Dialect rất tốt, nhưng khai báo rõ cho MySQL
spring.jpa.hibernate.ddl-auto=update

# Tắt tính năng query metadata của Hibernate để khởi động nhanh hơn (tùy chọn)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# ==========================================
# UPLOAD ẢNH SẢN PHẨM
# ==========================================
# Thư mục lưu ảnh (relative to working directory, hoặc absolute path)
app.upload-dir=./uploads
# Base URL để tạo imageUrl trả về FE
app.base-url=http://localhost:8810

# Giới hạn kích thước file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
