# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8810}
spring.application.name=product-catalog-service

# ==========================================
# EUREKA
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RENDER_SERVICE_NAME:product-catalog-service}
eureka.instance.non-secure-port=${PORT:8810}
eureka.instance.instance-id=${RENDER_SERVICE_ID:${spring.application.name}}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_catalog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================================
# UPLOAD ẢNH
# Trên Render free tier không có persistent disk → dùng Cloudinary hoặc S3
# Tạm thời giữ local upload nhưng lưu ý ảnh sẽ mất khi redeploy
# APP_BASE_URL set trên Render env vars (vd: https://ecom-product-catalog.onrender.com)
# ==========================================
app.upload-dir=${UPLOAD_DIR:./uploads}
app.base-url=${APP_BASE_URL:http://localhost:8810}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


# ==========================================
# EUREKA LEASE — chống stale instance khi Render redeploy
# ==========================================
# Heartbeat mỗi 10s (mặc định 30s)
eureka.instance.lease-renewal-interval-in-seconds=10
# Bị evict sau 20s không heartbeat (mặc định 90s)
eureka.instance.lease-expiration-duration-in-seconds=20

# ==========================================
# GRACEFUL SHUTDOWN
# Khi Render stop container, Spring Boot gửi deregister về Eureka
# trước khi tắt → không để lại stale instance
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Bật endpoint /actuator/shutdown để Render có thể trigger graceful stop
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,shutdown
