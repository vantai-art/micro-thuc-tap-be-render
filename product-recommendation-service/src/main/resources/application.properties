# ==========================================
# CẤU HÌNH SERVER & EUREKA
# ==========================================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.port=8812
spring.application.name=product-recommendation-service

# ==========================================
# CẤU HÌNH DATABASE (AIVEN POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/defaultdb
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Đăng ký với Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# ==========================================

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.show-sql=true
# Hibernate 6 tự động nhận diện Dialect cho MySQL 8+, không nhất thiết phải chỉ định
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# CẤU HÌNH FEIGN CLIENT (Tùy chọn cho Spring Boot 3)
# ==========================================
# Giúp theo dõi quá trình gọi API giữa các service nếu cần debug
logging.level.com.rainbowforest.productrecommendationservice.feignclient=DEBUG
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
